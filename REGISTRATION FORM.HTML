<DOCTYPE!.html>
<head>
<title>REGISTRATION FORM</title>
</head>
<body>
<h1>REGISTRATION FORM</h1>
<form>
<label>FIRST NAME: </label>
<input type="text" name="fname" placeholder="Enter your Name"required><br></br>
<label>LAST NAME: </label> 
<input type="text" name="lname" placeholder="Enter your Name"required><br></br>
<label>PASSWORD: </label> 
<input type="password" name="password" placeholder="Enter your Password"required><br></br>
<label>CONFIRM PASSWORD: </label>
<input type="password" name="confirm password" placeholder="Enter your Confirm Password"required><br></br>
<label>EMAIL: </label>
<input type="email" name="email" placeholder="Enter your email address"required><br></br>
<label>GENDER: </label>
<input type="radio" id="male"  name="gender" value="male">
<label>MALE:</label>
<input type="radio" id="female"  name="gender" value="female">
<label>FEMALE:</label>
<br></br>
<label>PHONE NO: </label>
<input type="tel" name="phnone no" placeholder="Enter your Number"required><br></br>
<label>DATE OF BIRTH: </label>
<input type="date"><br></br>
<label>COURSE:</label>
<select>
<option>Select Course</option>
<option>BCA</option>
<option>B.TECH</option>
<option>MCA</option>
<option>MBA</option>
<option>M.TECH</option>
</select><br></br>

<button type="submit">register</button>
</form>
</body>
</html>
